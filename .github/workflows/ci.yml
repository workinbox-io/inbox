name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets aren't needed to typecheck or build; a dummy keeps `wrangler types` complete.
      - run: echo "BETTER_AUTH_SECRET=ci" > .dev.vars
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

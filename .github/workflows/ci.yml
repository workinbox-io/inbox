name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Public repo: fail on any committed secret (rules and allowlist in .gitleaks.toml).
      # The binary, not gitleaks-action (that one needs a licence for org-owned repos).
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets aren't needed to typecheck or build; a dummy keeps `wrangler types` complete.
      - run: echo "BETTER_AUTH_SECRET=ci" > .dev.vars
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build

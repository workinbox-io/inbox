<!doctype html>
<!-- README header. Re-render: see docs/banner/render.mjs. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Inter Tight"; src: url("../../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 560px; }
  body {
    font-family: "Inter Tight", system-ui, sans-serif; color: #292929; overflow: hidden; position: relative;
    background: radial-gradient(900px 500px at 85% 20%, rgba(47,91,255,.10), transparent 60%), #ffffff;
  }
  body[data-theme="dark"] { color: #ededed; background: radial-gradient(900px 500px at 85% 20%, rgba(47,91,255,.22), transparent 60%), #191919; }
  .copy { position: absolute; left: 72px; top: 80px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 500; letter-spacing: -.02em; }
  .brand img { width: 36px; height: 36px; }
  h1 { margin-top: 44px; font-size: 58px; line-height: 1.04; font-weight: 500; letter-spacing: -.035em; }
  h1 span { color: #2f5bff; }
  body[data-theme="dark"] h1 span { color: #7d98ff; }
  p { margin-top: 22px; font-size: 20px; line-height: 1.45; color: #6d6d6d; letter-spacing: -.01em; }
  body[data-theme="dark"] p { color: #a1a1a1; }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 14px; font-weight: 500; padding: 7px 13px; border-radius: 999px; background: #f6f6f6; letter-spacing: -.01em; }
  body[data-theme="dark"] .chip { background: #262626; }
  .chip.cf { background: rgba(243,128,32,.12); color: #c25e07; }
  body[data-theme="dark"] .chip.cf { background: rgba(243,128,32,.18); color: #ffa45c; }
  .shot {
    position: absolute; left: 650px; top: 70px; width: 820px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 30px 80px -20px rgba(20,30,80,.35);
  }
  body[data-theme="dark"] .shot { box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 80px -20px rgba(0,0,0,.7); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../public/logo.svg" alt="" />SaaS template</div>
    <h1>Ship a micro SaaS <span>on Cloudflare.</span></h1>
    <p>Auth, teams, billing, API, docs and a dashboard that already looks good. You write the product.</p>
    <div class="chips">
      <span class="chip cf">Workers</span><span class="chip cf">D1</span><span class="chip cf">Queues</span><span class="chip cf">R2</span><span class="chip cf">Email</span>
      <span class="chip">Astro</span><span class="chip">Better Auth</span><span class="chip">Paddle</span><span class="chip">shadcn/ui</span>
    </div>
  </div>
  <div class="shot"><img id="shot" src="../screenshots/dashboard.png" alt="" /></div>
  <script>
    const theme = new URLSearchParams(location.search).get("theme") ?? "light";
    document.body.dataset.theme = theme;
    if (theme === "dark") document.getElementById("shot").src = "../screenshots/dashboard-dark.png";
  </script>
</body>
</html>
